name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check nexinfer tests
      - run: ruff format --check nexinfer tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio numpy pyyaml grpcio pydantic click tokenizers safetensors pygit2
      - name: Run tests (offline only)
        run: pytest tests/ -m "not network" -q
      - name: Run ORT/GGML smoke tests when runtime libs are buildable
        run: |
          pip install onnxruntime llama-cpp-python 2>/dev/null && \
            pytest tests/test_backends_smoke.py -q || \
            echo "optional runtime libs not available in this runner, skipping backend smoke tests"
