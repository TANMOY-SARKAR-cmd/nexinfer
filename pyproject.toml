[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexinfer"
version = "0.2.0"
description = "NexusInfer: cross-platform, hardware-agnostic, distributed AI inference engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NexusInfer Authors"}]
keywords = ["inference", "llm", "distributed", "cpu", "gpu", "tpu", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.22",
    "tokenizers>=0.15",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "zeroconf>=0.131",
    "pydantic>=2.5",
    "click>=8.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
webrtc = ["aiortc>=1.6"]
ggml = ["llama-cpp-python>=0.2.8"]
ort = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "ruff", "httpx"]
full = ["nexinfer[mcp,webrtc,ggml,ort,dev]"]

[project.scripts]
nexinfer = "nexinfer.cli.main:main"

[project.entry-points."nexinfer.backends"]
cpu_numpy = "nexinfer.backends.cpu_numpy:NumpyBackend"
ggml = "nexinfer.backends.ggml_backend:GGMLBackend"

[tool.setuptools.packages.find]
include = ["nexinfer*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# BLE001 (broad exception catch) and PLW1514 (unspecified open mode) are
# used deliberately in prototype/fallback code paths; everything else is
# checked against the default rule set.
ignore = ["BLE001", "PLW1514", "PLW1510", "S110", "S112",
        "TC004", "ASYNC220", "ASYNC230", "ISC004", "RUF100",
        "RUF012", "RUF034", "RUF046", "RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
